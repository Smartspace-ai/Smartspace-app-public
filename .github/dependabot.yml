version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Pacific/Auckland
    target-branch: develop
    open-pull-requests-limit: 3
    # React 19 is a deliberate migration, not a routine bump — it needs
    # cloneElement typing fixes in src/shared/ui/mui-compat/, @testing-library/react
    # on 16.x, and widened peer ranges in packages/chat-ui. Left ungated, the react
    # group re-proposes it every week and the PR fails CI every time (#324, #348,
    # #402 all closed or red). Gate the majors so the group's minors keep flowing;
    # drop these entries when the migration is actually scheduled.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-*"
          - "@types/react"
          - "@types/react-dom"
      tanstack:
        patterns:
          - "@tanstack/*"
      milkdown:
        patterns:
          - "@milkdown/*"
      mui:
        patterns:
          - "@mui/*"
          - "@emotion/*"
      azure-msal:
        patterns:
          - "@azure/*"
          - "@microsoft/*"
      nx:
        patterns:
          - "nx"
          - "@nx/*"
          - "@swc/*"
          - "@swc-node/*"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      # Catch-all — MUST stay last. Dependabot assigns each dependency to the
      # first group it matches, so the specific groups above win and this bundles
      # every remaining npm update into ONE weekly PR instead of per-package PRs.
      other:
        patterns:
          - "*"
    labels:
      - dependencies
      - npm

  - package-ecosystem: npm
    directory: "/packages/chat-ui"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Pacific/Auckland
    target-branch: develop
    open-pull-requests-limit: 3
    # Mirrors the root entry above — chat-ui declares react/react-dom as peer
    # dependencies, so its React major has to move in lockstep with the app's.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-*"
          - "@types/react"
          - "@types/react-dom"
      # Catch-all — MUST stay last; bundles every remaining npm update into ONE PR.
      other:
        patterns:
          - "*"
    labels:
      - dependencies
      - npm

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Pacific/Auckland
    target-branch: develop
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
