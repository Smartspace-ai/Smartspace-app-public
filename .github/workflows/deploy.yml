name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: GitHub environment name (dev or production)
      ref:
        required: false
        type: string
        default: ""
        description: Git ref (tag/branch/SHA) to build. Empty = the triggering ref.

permissions:
  contents: read
  id-token: write # for the GitHub OIDC token azure/login exchanges - no stored credential

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The build reads no configuration. The site reads ss-config.js when it
      # loads, and this step writes that file from the environment's variables;
      # the build then copies public/ into the site.
      - name: Write ss-config.js from environment
        env:
          Client_Id: ${{ vars.VITE_CLIENT_ID }}
          Client_Authority: ${{ vars.VITE_CLIENT_AUTHORITY }}
          Client_Scopes: ${{ vars.VITE_CLIENT_SCOPES }}
          Chat_Api_Uri: ${{ vars.VITE_CHAT_API_URI }}
          Teams_Use_Msal: ${{ vars.VITE_TEAMS_USE_MSAL }}
          Tenant_Id: ${{ vars.VITE_TENANT_ID }}
          Teams_Sso_Resource: ${{ vars.VITE_TEAMS_SSO_RESOURCE }}
        run: |
          set -euo pipefail
          missing=""
          for key in Client_Id Client_Authority Client_Scopes Chat_Api_Uri Teams_Use_Msal; do
            [ -n "${!key}" ] || missing="$missing VITE_$(echo "$key" | tr '[:lower:]' '[:upper:]')"
          done
          if [ -n "$missing" ]; then
            echo "::error::Environment variables not set:$missing"
            exit 1
          fi
          config=$(jq -n '{
            Client_Id: env.Client_Id,
            Tenant_Id: env.Tenant_Id,
            Client_Authority: env.Client_Authority,
            Client_Scopes: env.Client_Scopes,
            Chat_Api_Uri: env.Chat_Api_Uri,
            Teams_Sso_Resource: env.Teams_Sso_Resource,
            Teams_Use_Msal: env.Teams_Use_Msal
          } | with_entries(select(.value != ""))')
          echo "window.ssconfig = $config;" > public/ss-config.js

      - name: Build
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.20.3"
          verb: call
          module: ./ci
          args: >-
            build
            --source=.
            export --path=./dist/smartspace

      - name: Copy index.html to 404.html for SPA deep-link refreshes
        run: cp ./dist/smartspace/index.html ./dist/smartspace/404.html

      - name: Azure login
        # Environments that define AZURE_STORAGE_ACCOUNT deploy with OIDC + RBAC (Storage Blob
        # Data Contributor on that account). Environments without it keep the connection string:
        # the demo install's web account sits under a managed-app deny assignment that blocks
        # RBAC data access for every principal, so Shared Key is the only way to write to it.
        if: vars.AZURE_STORAGE_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Storage
        uses: azure/CLI@v2
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        with:
          azcliversion: 2.67.0
          inlineScript: |
            if [ -n "$STORAGE_ACCOUNT" ]; then
              # azure/login ran on the runner's newer az, whose msal leaves a pickled HTTP cache
              # this pinned image's older msal can't load. The token cache is JSON, so only this goes.
              rm -f ~/.azure/msal_http_cache.bin ~/.azure/msal_http_cache.json
              auth=(--account-name "$STORAGE_ACCOUNT" --auth-mode login)
            else
              auth=(--connection-string "$STORAGE_CONNECTION_STRING")
            fi

            # Upload the whole build with no-cache so returning users always
            # revalidate index.html and pick up the latest asset references.
            az storage blob upload-batch "${auth[@]}" \
              --source ./dist/smartspace \
              --destination '$web' \
              --content-cache-control 'no-cache, max-age=0, must-revalidate' \
              --overwrite true

            # Re-upload hashed bundles with long-lived immutable cache.
            # Vite emits content hashes in these filenames, so cached copies never go stale.
            az storage blob upload-batch "${auth[@]}" \
              --source ./dist/smartspace/assets \
              --destination '$web/assets' \
              --content-cache-control 'public, max-age=31536000, immutable' \
              --overwrite true
