name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: GitHub environment name (dev or production)
      ref:
        required: false
        type: string
        default: ""
        description: Git ref (tag/branch/SHA) to build. Empty = the triggering ref.

permissions:
  contents: read
  id-token: write # for the GitHub OIDC token azure/login exchanges - no stored credential

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Generate .env from environment
        run: |
          {
            echo "VITE_CLIENT_ID=${{ vars.VITE_CLIENT_ID }}"
            echo "VITE_CLIENT_AUTHORITY=${{ vars.VITE_CLIENT_AUTHORITY }}"
            echo "VITE_CLIENT_SCOPES=${{ vars.VITE_CLIENT_SCOPES }}"
            echo "VITE_CHAT_API_URI=${{ vars.VITE_CHAT_API_URI }}"
            echo "VITE_TEAMS_USE_MSAL=${{ vars.VITE_TEAMS_USE_MSAL }}"
            echo "VITE_TENANT_ID=${{ vars.VITE_TENANT_ID }}"
          } > .env

      - name: Validate .env
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.20.3"
          verb: call
          module: ./ci
          args: >-
            check-env
            --source=.

      - name: Build
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.20.3"
          verb: call
          module: ./ci
          args: >-
            build
            --source=.
            export --path=./dist/smartspace

      - name: Copy index.html to 404.html for SPA deep-link refreshes
        run: cp ./dist/smartspace/index.html ./dist/smartspace/404.html

      - name: Azure login
        # Environments that define AZURE_STORAGE_ACCOUNT deploy with OIDC + RBAC (Storage Blob
        # Data Contributor on that account). Environments without it keep the connection string:
        # the demo install's web account sits under a managed-app deny assignment that blocks
        # RBAC data access for every principal, so Shared Key is the only way to write to it.
        if: vars.AZURE_STORAGE_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Storage
        uses: azure/CLI@v2
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        with:
          azcliversion: 2.67.0
          inlineScript: |
            if [ -n "$STORAGE_ACCOUNT" ]; then
              auth=(--account-name "$STORAGE_ACCOUNT" --auth-mode login)
            else
              auth=(--connection-string "$STORAGE_CONNECTION_STRING")
            fi

            # Upload the whole build with no-cache so returning users always
            # revalidate index.html and pick up the latest asset references.
            az storage blob upload-batch "${auth[@]}" \
              --source ./dist/smartspace \
              --destination '$web' \
              --content-cache-control 'no-cache, max-age=0, must-revalidate' \
              --overwrite true

            # Re-upload hashed bundles with long-lived immutable cache.
            # Vite emits content hashes in these filenames, so cached copies never go stale.
            az storage blob upload-batch "${auth[@]}" \
              --source ./dist/smartspace/assets \
              --destination '$web/assets' \
              --content-cache-control 'public, max-age=31536000, immutable' \
              --overwrite true
