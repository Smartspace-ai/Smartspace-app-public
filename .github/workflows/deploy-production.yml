name: Deploy to production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write # deploy.yml can only use what the caller grants
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
